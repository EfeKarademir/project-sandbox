<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save to TabNest</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body class="popup">
  <div class="popup-wrap">
    <div class="popup-head">
      <h2>Save to TabNest</h2>
      <button id="open-dashboard" title="Open the TabNest dashboard">Open dashboard</button>
    </div>
    <select id="collection" aria-label="Collection"></select>
    <button id="save-tab">Save this tab</button>
    <button id="save-window">Save all tabs in window</button>
    <div class="popup-appearance">
      <label>Theme
        <select id="picker-theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Palette
        <select id="picker-palette">
          <option value="classic">Classic</option>
          <option value="ocean">Ocean</option>
          <option value="sepia">Sepia</option>
          <option value="nocturne">Nocturne</option>
        </select>
      </label>
    </div>
    <div class="popup-foot">
      <p id="status" aria-live="polite"></p>
    </div>
  </div>
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
