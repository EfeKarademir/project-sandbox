<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TabNest</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header>
    <h1>TabNest</h1>
    <input id="search" type="search" placeholder="Search tabs… (Ctrl+K)" autocomplete="off" spellcheck="false">
    <button id="btn-new" title="Create a collection">+ Collection</button>
    <button id="btn-export" title="Download a JSON backup of all data">Export</button>
    <button id="btn-import" title="Restore a JSON backup or import bookmarks HTML">Import</button>
    <input id="file-import" type="file" accept=".json,.html,.htm" hidden>
    <label class="switch"><input type="checkbox" id="show-archived"><span>Archived</span></label>
  </header>

  <main id="grid"></main>

  <div id="results" hidden></div>

  <div id="empty" hidden>
    <p>Nothing saved yet</p>
    <p class="sub">Tabs you save appear on this page, ready to reopen.</p>
    <ol>
      <li>Right-click any page → <b>Save tab to TabNest</b></li>
      <li>Or save from the TabNest toolbar popup</li>
      <li><b>Alt+Shift+S</b> saves every tab in this window</li>
    </ol>
  </div>

  <script src="db.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
