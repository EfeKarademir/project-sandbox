<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TabNest</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">TabNest</div>
    <nav>
      <button id="nav-all" class="nav-item active">Dashboard</button>
      <button id="nav-archived" class="nav-item">Archived</button>
    </nav>
    <div class="sidebar-foot">
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
    </div>
  </aside>

  <div id="content">
    <div id="topbar">
      <input id="search" type="search" placeholder="Search tabs… (Ctrl+K)" autocomplete="off" spellcheck="false">
      <button id="btn-new">New Collection</button>
    </div>

    <main id="grid"></main>

    <div id="empty" hidden>
      <p>Nothing saved yet</p>
      <p class="sub">Tabs you save appear on this page, ready to reopen.</p>
      <ol>
        <li>Right-click any page → <b>Save tab to TabNest</b></li>
        <li>Or save from the TabNest toolbar popup</li>
        <li><b>Alt+Shift+S</b> saves every tab in this window</li>
      </ol>
    </div>
  </div>

  <div id="results" hidden></div>
  <input id="file-import" type="file" accept=".json,.html,.htm" hidden>

  <script src="db.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
